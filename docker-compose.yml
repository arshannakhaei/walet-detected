# Optional: run ChainTrace in Docker.  First time:  copy .env.example .env
# then:  docker compose up -d --build   and open http://127.0.0.1:8765
# Docker does not make blockchain APIs faster; add free API keys in Settings for that.
services:
  chaintrace:
    build:
      context: .
      args:
        # Set PIP_INDEX_URL in .env to build through a PyPI mirror (see README).
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:8765:8765"   # reachable from this computer only
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      SETTINGS_FROM_ANY_CLIENT: "true"   # lets the Settings page save keys from inside Docker
    volumes:
      - ./backend/data:/app/backend/data   # cache, cases, labels survive rebuilds
      - ./.env:/app/.env                   # API keys saved from Settings persist
    restart: unless-stopped
